name: macOS build
on: workflow_dispatch

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autobuild-2025-11-12-13-44   # = v1.1.4, the version you already ship
          submodules: recursive              # ffmpeg-kit is a submodule

      - name: Install build tools
        run: make bootstrap

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install scons

      - name: Build
        run: make gdextension PLATFORM=macos

      - name: Collect binaries
        run: |
          mkdir -p out
          find . -name "libgdffmpeg.macos.*" -maxdepth 6 -exec cp -R {} out/ \;
          find thirdparty/ffmpeg/macos -name "*.dylib" -exec cp {} out/ \;
          ls -lR out

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: out/
