name: macOS build
on: workflow_dispatch

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EIRTeam/EIRTeam.FFmpeg
          ref: autobuild-2025-11-12-13-44

      - name: Fetch submodules
        run: |
          git submodule update --init --progress
          ls -la ffmpeg-kit gdextension_build/godot-cpp

      - name: Install build tools
        run: make bootstrap

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install scons

      - name: Build
        run: make gdextension PLATFORM=macos

      - name: Collect binaries
        if: always()
        run: |
          mkdir -p out
          find . -name "libgdffmpeg.macos.*" -maxdepth 6 -exec cp -R {} out/ \; || true
          find thirdparty/ffmpeg/macos -name "*.dylib" -exec cp {} out/ \; || true
          ls -lR out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg-macos
